name: Bug report
description: Report a reproducible problem with pyspark-udtf
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include credentials or sensitive data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: pyspark-udtf version
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python, PySpark, operating system, and runtime versions.
      placeholder: Python 3.11, PySpark 4.0.0, macOS 15
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and which UDTF is affected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or steps that reproduce the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Paste relevant, redacted output or add any other useful context.
      render: shell
